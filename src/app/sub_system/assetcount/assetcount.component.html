<div class="card shadow-sm" style="border: none">
  <div class="card-body">
    <h1>
      <span class="anuphan-700">
        ตรวจนับครุภัณฑ์
      </span>
    </h1>
    <hr />
    <div class="card" style="border: none;">
      <div class="card-body">

        <form 
          [formGroup]="assetForm" 
          (ngSubmit)="onSubmit()">

          <input 
            type="text" 
            formControlName="date" 
            hidden />

          <div class="row mb-3">

            <!-- 🔹 หน่วยงาน / สำนักงาน -->
            <div class="col">

              <label for="DepartmentId" class="form-label" style="font-weight: bold">
                <span class="text-danger">*</span> หน่วยงาน / สำนักงาน
              </label>

              <div class="form-control">

                <mat-select 
                  formControlName="DepartmentId"
                  placeholder="เลือกหน่วยงาน สำนักงาน" 
                  (selectionChange)="onDepartmentChange($event)"
                  panelClass="mat-select-panel" 
                  style="font-family: 'Anuphan', sans-serif; font-weight: 600">
                  
                  <mat-option>
                    <ngx-mat-select-search 
                      placeholderLabel="ค้นหาสถานที่" 
                      noEntriesFoundLabel="ไม่พบข้อมูล"
                      [formControl]="DepartmentFilterCtrl">
                    </ngx-mat-select-search>
                  </mat-option>

                  <mat-option 
                    *ngFor="let DepId of (filteredDepartment | async)" 
                    [value]="DepId.DeptId">
                    <span class="anuphan-600">
                      {{ DepId.Semin }} : {{ DepId.Name }}
                    </span>
                  </mat-option>
                  
                </mat-select>
              </div>
            </div>

            <!-- 🔹 ฝ่าย -->
            <div class="col">

              <label for="FactionId" class="form-label" style="font-weight: bold">
                <span class="text-danger">*</span> ฝ่าย
              </label>

              <div class="form-control">

                <mat-select 
                  formControlName="FactionId" 
                  placeholder="เลือกฝ่าย"
                  (selectionChange)="onFactionChange($event)" 
                  panelClass="mat-select-panel"
                  style="font-family: 'Anuphan', 
                  sans-serif; font-weight: 600">
                  
                  <mat-option>
                    <ngx-mat-select-search 
                      placeholderLabel="ค้นหาฝ่าย" 
                      noEntriesFoundLabel="ไม่พบข้อมูล"
                      [formControl]="factionsFilterCtrl">
                    </ngx-mat-select-search>
                  </mat-option>

                  <mat-option 
                    *ngFor="let faction of (filteredFactions | async)" 
                    [value]="faction.FactId">

                    <span class="anuphan-600">
                      {{ faction.Semin }} : {{ faction.Name }}
                    </span>

                  </mat-option>

                </mat-select>
              </div>
            </div>

          </div>

          <div class="row">

            <div class="col">
              <label for="" class="form-label">
                <span class="text-danger">*</span> 
                ชื่อรายการการตรวจนับ
              </label>

              <input 
                type="text" 
                formControlName="sessionName" 
                class="form-control" 
                placeholder="ชื่อรายการ" />  
            </div>

            <!-- 🔹 รายชื่อผู้ตรวจนับ -->
            <div class="col">

              <label for="inspectors" class="form-label">
                <span class="text-danger">*</span> รายชื่อผู้ตรวจนับ
              </label>

              <div formArrayName="inspectors">
                <div *ngFor="let inspectorControl of inspectorsArray.controls; let i = index">
                  <ng-container *ngIf="isFormGroup(inspectorControl)">
                    <div 
                      [formGroup]="inspectorControl" 
                      class="d-flex gap-2 mb-2">

                      <mat-select 
                        formControlName="inspectorId" 
                        class="form-control">

                        <mat-option 
                          *ngFor="let person of inspectors" 
                          [value]="person.UserId">
                          {{person.Prefix}} {{ person.Sname}} {{person.Lname}}
                        </mat-option>

                      </mat-select>

                      <button 
                        type="button" 
                        class="btn btn-danger" 
                        (click)="removeInspector(i)">
                        ลบ
                      </button>

                    </div>
                  </ng-container>
                </div>
              </div>
              
              <button 
                type="button" 
                class="btn btn-sm btn-outline-primary " 
                (click)="addInspector()">
                เพิ่มผู้ตรวจนับ
              </button><br/><br/>
            </div>

            <div class="col">

              <label for="" class="form-label">
                <span class="text-danger">*</span> 
                ชื่อผู้ตรวจสอบรายการ
              </label>

              <mat-select 
                formControlName="verifierId" 
                class="form-control">
                <mat-option 
                  *ngFor="let person of inspectors" 
                  [value]="person.UserId">
                  {{person.Prefix}} {{ person.Sname}} {{person.Lname}}
                </mat-option>
              </mat-select>

            </div>

          </div>

          <!-- 🔹 ปุ่มเพิ่มครุภัณฑ์ -->
          <div class="row mb-3">
            
            <div class="col d-grid">
              <button type="button" class="btn btn-outline-success p-3" (click)="addForm()">
                <svg [cIcon]="icons.cibAddthis"></svg> เพิ่มครุภัณฑ์
              </button>
            </div>

            <!-- 🔹 ปุ่มสแกน QR Code -->
            <div class="col d-grid">
              <button type="button" class="btn btn-outline-success p-3" (click)="openQrScanner()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" style="width: 20px;">
                  <path fill="#ffffff" d="M0 224h192V32H0v192zM64 96h64v64H64V96zm192-64v192h192V32H256zm128 
                  128h-64V96h64v64zM0 480h192V288H0v192zm64-128h64v64H64v-64zm352-64h32v128h-96v-32h-32v96h-64V288h96v32h64v-32zm0 
                  160h32v32h-32v-32zm-64 0h32v32h-32v-32z" />
                </svg> QR-code
              </button>
            </div>
          </div>

          <!-- 🔹 ตารางครุภัณฑ์ -->
            <div class="table-responsive">
              <table class="table table-bordered table-hover">
                <thead>
                  <tr>
                    <th class="text-center" style="width: 50px;">ลำดับ</th>
                    <th class="text-center">รหัสครุภัณฑ์</th>
                    <th class="text-center">รายการ</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of formArray.controls; let rowIndex = index">

                    <td class="text-center">
                      {{ rowIndex + 1 }}
                    </td>
                  
                    <!-- 🔍 ค้นหาครุภัณฑ์ -->
                    <td class="align-middle">
                      <div class="input-group">
                        <input
                          type="text"
                          class="form-control"
                          placeholder="พิมพ์คำค้นหา"
                          [(ngModel)]="searchTerms[rowIndex]"
                          [ngModelOptions]="{ standalone: true }"
                          style="font-family: 'Anuphan', 
                          sans-serif; font-weight: 400; 
                          border: none; background: none;"
                          aria-label="Search"
                          aria-describedby="inputGroup-sizing-default"
                        />
                  
                        <button
                          type="button"
                          class="btn btn-success"
                          (click)="onSearch(rowIndex)"
                          style="font-family: 'Anuphan', 
                          sans-serif; font-weight: 600; 
                          color: white;">
                          ค้นหา
                        </button>

                      </div>
                    </td>
                  
                    <!-- 📋 แสดงชื่อครุภัณฑ์ของแถวนั้น -->
                    <td class="align-middle">
                      <input 
                        type="text" 
                        class="form-control" 
                        [value]="assetNames[rowIndex] || 'ไม่พบข้อมูล'"
                        style="border: none; background: none;"
                        readonly />
                    </td>
                  </tr>
                  
                </tbody>
              </table>
            </div>
 
            <button 
              class="btn btn-success" 
              style="color: white;" 
              type="submit">
              ดำเนินการ
            </button>

        </form>
  
      </div>
    </div>
  </div>
</div>
