        <!-- Paginator -->
        <div class="col">
          <br/>
          <mat-paginator 
          [pageSizeOptions]="[5, 10, 15, 30, 50, 70, 100]" 
          [pageSize]="10" showFirstLastButtons
            class="paginator-style"></mat-paginator>
        </div>
      </div>
    
      <div class="table-responsive">
        <table class="table table-striped table-hover" 
        style="font-size: 10.5px; width: fit-content" 
        mat-table matSort [dataSource]="dataSource" >
  
          <!-- Actions Column -->
          <ng-container matColumnDef="Aactions">
      
            <th class="text-center border"
              mat-header-cell 
              *matHeaderCellDef 
              style="color: black; font-weight: bold">
              # <input cFormControl sizing="sm" disabled />
            </th>
  
            <td class="border" mat-cell *matCellDef="let asset" style="width: 5%">
              
              <button class="btn btn-sm  btn-primary m-1" (click)="assetDialog(asset.AssetId)">
                <svg [cIcon]="this.myFunctionInstance?.icons?.cilSearch"
                style="color: white; width: 16px; height: 16px;"></svg>
              </button>
            
            </td>
  
          </ng-container>
  
          <ng-container matColumnDef="Qrcode">
            <th class="text-center border" mat-header-cell *matHeaderCellDef style="color: black; font-weight: bold;width: 5%;">
              Qrcode
              <input cFormControl sizing="sm" disabled />
            </th>
  
            <td class="border" mat-cell *matCellDef="let asset" style="width: fit-content">
              <div *ngIf="asset.qrCodeUrl">
                <img [src]="asset.qrCodeUrl" alt="QR Code" style="width: 50px; height: 50px; margin-top: 5px" />
              </div>
            </td>
          </ng-container>
  
          <!-- <ng-container matColumnDef="addcol">
            <th class="text-center border" mat-header-cell *matHeaderCellDef style="color: black; font-weight: bold">
              +
              <button mat-raised-button color="primary" (click)="toggleColumn2()">+</button>
            </th>
            <td class="border" mat-cell *matCellDef="let asset" style="width: 300px;"></td>
          </ng-container> -->
  
          <!-- Dynamic Columns -->
          <ng-container *ngFor="let column of displayedColumns2; let i = index" [matColumnDef]="column">
            <th class="mat-header-cell anuphan-600 border" 
                mat-header-cell *matHeaderCellDef 
                mat-sort-header
                [style.width]="column === 'สถานะ' ? '2%' : (column === 'รายการ' ? '20%' : 'auto')">
              <div style="color: black; font-weight: bold">
                <label cLabel>{{ column }}</label>
                <input 
                  cFormControl sizing="sm" 
                  placeholder="ค้นหาข้อมูล" 
                  (keyup)="applyFilter($event)"
                  (focus)="setupFilter(column)" />
              </div>
            </th>
          
            <td class="anuphan-500 border" mat-cell *matCellDef="let asset">
              <!-- Handle currency formatting -->
              <ng-container *ngIf="column === 'ราคาต่อหน่วย'; else defaultFormat">
                {{ asset[column] | currency : "" : "" : "1.2-2" }}
              </ng-container>
          
              <!-- Handle status badge formatting -->
              <ng-template #defaultFormat>
                <ng-container *ngIf="column === 'สถานะ'; else normalText">
                  <span class="badge text-light"
                    [ngClass]="{
                      'text-bg-success': asset[column] !== 'โอนย้าย' && 
                                        asset[column] !== 'ซ่อมแซม' && 
                                        asset[column] !== 'ส่งมอบ' && 
                                        asset[column] !== '',
                      'text-bg-warning': asset[column] === 'โอนย้าย' || asset[column] === 'ส่งมอบ',
                      'text-bg-danger': asset[column] === 'ซ่อมแซม'
                    }"
                    style="color: black; font-size: 16px;">
                    {{ asset[column] || 'ปกติ' }}
                  </span>
                </ng-container>
          
                <!-- Default text display -->
                <ng-template #normalText>
                  {{ asset[column] }}
                </ng-template>
              </ng-template>
            </td>
          </ng-container>
          
          <!-- Header Row -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns3"></tr>
  
          <!-- Data Rows -->
          <tr mat-row *matRowDef="let row; columns: displayedColumns3"></tr>

        </table>
      </div>

      <!-- ✅ แสดงข้อความเมื่อไม่มีข้อมูล -->
      <div 
        *ngIf="dataSource.data.length === 0"  
        class="alert alert-info text-center">
        ไม่มีข้อมูลในระบบ กรุณาเพิ่มข้อมูลหรือรอการอัปเดต
      </div>
      
      <button class="btn btn-warning m-2" 
          *ngIf="dataSource && dataSource.data.length > 0"
          (click)="updateAllStatuses()">
          อัปเดตสถานะทั้งหมด
        </button>
  
    </div>
  
  </div>
