<div class="card shadow-sm" style="border: none">
    <div class="card-body ">

        <div class="border-bottom mb-3" style="display: flex; justify-content: space-between; align-items: center">
            <div style="margin-right: auto">
              <h1>
                <span class="anuphan-700">ข้อมูลผู้ใช้งาน</span>
              </h1>
            </div>
            <p>
            
            </p>
          </div>
 
        <div class="p-2">
          <div class="row">
            <div class="col"> 
              <div class="d-flex align-items-center mb-3">
            <!-- Search Input with Button -->
            <div class="input-group">
              <input
                type="text"
                id="search"
                class="form-control"
                (keyup)="applyFilter($event)"
                placeholder="ค้นหาด่วน"
              />
              <button
                class="btn btn-outline-primary"
                *ngIf="searchValue"
                (click)="clearSearch()"
              >
                <mat-icon>close</mat-icon>
              </button>
            </div>
          
            <!-- Refresh Button -->
            <button
              class="btn btn-outline-primary btn-sm ms-2"
              (click)="refreshData()"
            >
              <mat-icon style="margin-top: 8px;">refresh</mat-icon>
            </button>
          </div>


            </div>

            <div class="col"></div>
          </div>
         
          
          
          <div class="table-responsive">
              <table mat-table [dataSource]="dataSource" matSort class="table table-striped table-hover" style="width: fit-content;">

                  <!-- Actions Column -->
                  <ng-container matColumnDef="actions">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef style="font-weight: bold;" >#</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user">
                          <button class="btn btn-sm btn-warning m-1" (click)="editUser(user)"
                              style="width: 28px; height: 28px; padding: 4px;">
                              <svg [cIcon]="icons.cilPencil" style="color: white; width: 100%; height: 100%;"></svg>
                          </button>

                          <button class="btn btn-sm btn-danger m-1" (click)="deleteUser(user)"
                              style="width: 28px; height: 28px; padding: 4px;">
                              <svg [cIcon]="icons.cilTrash" style="color: white; width: 100%; height: 100%;"></svg>
                          </button>
                      </td>
                  </ng-container>

                  <!-- User Code Column -->
                  <ng-container matColumnDef="รหัสผู้ใช้" style="width: fit-content;">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;width: fit-content;">รหัสผู้ใช้</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user" style="width: fit-content;">{{ user.codeId }}</td>
                  </ng-container>

                  <!-- Username Column -->
                  <ng-container matColumnDef="ชื่อผู้ใช้">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;width: 10%;">ชื่อผู้ใช้</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user">{{ user.username }}</td>
                  </ng-container>

                  <!-- First Name Column -->
                  <ng-container matColumnDef="ชื่อ">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">ชื่อ</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user">{{ user.sname }}</td>
                  </ng-container>

                  <!-- Last Name Column -->
                  <ng-container matColumnDef="นามสกุล">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">นามสกุล</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user">{{ user.lname }}</td>
                  </ng-container>

                  <!-- Position Column -->
                  <ng-container matColumnDef="ตำแหน่ง">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">ตำแหน่ง</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user">{{ user.position }}</td>
                  </ng-container>

                  <!-- Subposition Column -->
                  <ng-container matColumnDef="ตำแหน่งย่อย">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">ตำแหน่งย่อย</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user">{{ user.subposition }}</td>
                  </ng-container>

                  <!-- Workgroup Column -->
                  <ng-container matColumnDef="กลุ่มงาน">
                      <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">กลุ่มงาน</th>
                      <td class="border anuphan-400" mat-cell *matCellDef="let user">{{ user.workgroup }}</td>
                  </ng-container>

                  <!-- <ng-container matColumnDef="บทบาท">
                    <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;width: 17%;">
                      บทบาท
                    </th>
                    <td class="border anuphan-400" mat-cell *matCellDef="let user" style="width: 17%;">

                      <div class="form-control anuphan-600">
                        <mat-select
                          class=" anuphan-600"
                          [(ngModel)]="user.roles"
                          (selectionChange)="updateUserRole(user.id, $event.value)"
                          [placeholder]="user.roles" 
                          style="font-family:Anuphan,sans-serif;font-optical-sizing:auto;font-weight:500;font-style:normal"
                        >
                          <mat-option class="border-bottom" *ngFor="let role of availableRoles" [value]="role">
                            <div class=" anuphan-600">{{ role }}</div>
                          </mat-option>
                        </mat-select>
                      </div>
                    </td>
                  </ng-container> -->

                  <ng-container matColumnDef="บทบาท">
                    <th class="text-center border anuphan-600" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;width: 17%;">
                      บทบาท
                    </th>
                    <td class="border anuphan-400" mat-cell *matCellDef="let user" style="width: 17%;">
                      <button 
                        class="btn btn-sm rounded-pill" 
                        [ngClass]="getRoleClass(user.roles)" 
                        (click)="openRoleDialog(user)">
                        {{ user.roles }}
                      </button>

                    </td>
                  </ng-container>
                  
                  
                  

                  <!-- Header Row -->
                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                  <!-- Data Rows -->
                  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
              </table>

              <!-- Paginator -->
              <mat-paginator [pageSizeOptions]="[30, 50, 70, 100]" [pageSize]="15" showFirstLastButtons></mat-paginator>
          </div>
        </div>
    </div>
</div>
