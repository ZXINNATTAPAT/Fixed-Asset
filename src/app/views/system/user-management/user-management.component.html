        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" matSort class="table table-striped table-hover">

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef style="font-weight: bold;">#</th>
                    <td class="border" mat-cell *matCellDef="let user">
                        <button class="btn btn-sm btn-warning m-1" (click)="editUser(user)"
                            style="width: 28px; height: 28px; padding: 4px;">
                            <svg [cIcon]="icons.cilPencil" style="color: white; width: 100%; height: 100%;"></svg>
                        </button>

                        <button class="btn btn-sm btn-danger m-1" (click)="deleteUser(user)"
                            style="width: 28px; height: 28px; padding: 4px;">
                            <svg [cIcon]="icons.cilTrash" style="color: white; width: 100%; height: 100%;"></svg>
                        </button>
                    </td>
                </ng-container>

                <!-- User Code Column -->
                <ng-container matColumnDef="รหัสผู้ใช้">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">รหัสผู้ใช้</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.codeId }}</td>
                </ng-container>

                <!-- Username Column -->
                <ng-container matColumnDef="ชื่อผู้ใช้">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">ชื่อผู้ใช้</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.username }}</td>
                </ng-container>

                <!-- First Name Column -->
                <ng-container matColumnDef="ชื่อ">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">ชื่อ</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.sname }}</td>
                </ng-container>

                <!-- Last Name Column -->
                <ng-container matColumnDef="นามสกุล">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">นามสกุล</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.lname }}</td>
                </ng-container>

                <!-- Position Column -->
                <ng-container matColumnDef="ตำแหน่ง">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">ตำแหน่ง</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.position }}</td>
                </ng-container>

                <!-- Subposition Column -->
                <ng-container matColumnDef="ตำแหน่งย่อย">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">ตำแหน่งย่อย</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.subposition }}</td>
                </ng-container>

                <!-- Workgroup Column -->
                <ng-container matColumnDef="กลุ่มงาน">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">กลุ่มงาน</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.workgroup }}</td>
                </ng-container>

                <!-- Roles Column -->
                <ng-container matColumnDef="บทบาท">
                    <th class="text-center border" mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">บทบาท</th>
                    <td class="border" mat-cell *matCellDef="let user">{{ user.roles }}</td>
                </ng-container>

                <!-- Header Row -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                <!-- Data Rows -->
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>

            <!-- Paginator -->
            <mat-paginator [pageSizeOptions]="[30, 50, 70, 100]" [pageSize]="15" showFirstLastButtons></mat-paginator>
        </div>
    </div>
</div>
