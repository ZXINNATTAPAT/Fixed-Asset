<div class="card shadow-sm" style="border: none">
  <div class="card-body ">
    
    <h1><span class="anuphan-700">ตรวจนับครุภัณท์ ({{this.userinfo.workgroup}})</span></h1>
    <hr />

    <div class="card" style="border: none;">
      <div class="card-body">
        <form cForm [formGroup]="assetForm" (ngSubmit)="onSubmit()">

          <input class="p-3" cFormControl placeholder="กรอกข้อมูล" type="text" formControlName="date" hidden />

          <input class="p-3" cFormControl placeholder="กรอกข้อมูล" type="text" formControlName="serialNumber" hidden />


          <div class="row mb-3">
            <div class="col">
              <label for="departmentCode" cLabel class="form-label">
                <span class="text-danger">*</span> แผนก
              </label>
              <input id="departmentCode" class="form-control p-3" cFormControl placeholder="กรอกข้อมูล" type="text"
                formControlName="departmentCode" />
            </div>

            <div class="col">
              <label for="locationCode" cLabel class="form-label">
                <span class="text-danger">*</span> ที่ตั้ง
              </label>
              <input id="locationCode" class="form-control p-3" cFormControl placeholder="กรอกข้อมูล" type="text"
                formControlName="locationCode" />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col">
              <label for="inspector" cLabel class="form-label">
                <span class="text-danger">*</span> ผู้ตรวจนับ
              </label>
              <input id="inspector" class="form-control p-3" cFormControl placeholder="กรอกข้อมูล" type="text"
                formControlName="inspector" />
            </div>

            <div class="col">
              <label for="verifier" cLabel class="form-label">
                <span class="text-danger">*</span> ผู้ตรวจสอบ
              </label>
              <input id="verifier" class="form-control p-3" cFormControl placeholder="กรอกข้อมูล" type="text"
                formControlName="verifier" />
            </div>

            <div class="col">
              <label for="note" cLabel class="form-label">
                <span class="text-danger">*</span> หมายเหตุ
              </label>
              <input id="note" class="form-control p-3" cFormControl type="text" formControlName="note"
                placeholder="ระบุหมายเหตุ" />
            </div>
          </div>


          <br />
          <div class="row mb-2">
            <div class="col d-grid">
              <button type="button" class="btn btn-outline-success anuphan-600  p-3" style="color: green"
                (click)="addform()">
                <svg [cIcon]="icons.cibAddthis"></svg> เพิ่มครุภัณฑ์
              </button>
            </div>

            <div class="col d-grid">

              <button type="button" class="btn btn-success anuphan-600 p-3" style="color: white"
                (click)="startScanner = true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" style="width: 20px;">
                  <path fill="#ffffff"
                    d="M0 224h192V32H0v192zM64 96h64v64H64V96zm192-64v192h192V32H256zm128 128h-64V96h64v64zM0 480h192V288H0v192zm64-128h64v64H64v-64zm352-64h32v128h-96v-32h-32v96h-64V288h96v32h64v-32zm0 160h32v32h-32v-32zm-64 0h32v32h-32v-32z" />
                </svg>
                QR-code
              </button>
            </div>
          </div> 
          <br />

          <div *ngIf="startScanner">
            <zxing-scanner class="qr-scanner-container" [device]="selectedDevice" (scanSuccess)="onScanSuccess($event)"
              [formats]="allowedFormats" [autostart]="true">
            </zxing-scanner>
          </div>

          <br />

          <div class="table-responsive">

            <div class="table-responsive">
              <table class="table table-bordered table-hover">
                <thead>
                  <tr >
                    <th class="text-center" style="width: 75px;">ลำดับ</th>
                    <ng-container *ngFor="let column of displayedColumns3">
                      <th class="text-center border">{{ column }}</th>
                    </ng-container>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let formGroup of formArray.controls; let rowIndex = index">
                    <td class="text-center align-middle">{{ rowIndex + 1 }}</td>
            
                    <ng-container *ngFor="let column of displayedColumns3">
                      <ng-container *ngIf="column !== 'ลำดับ'">
                        <!-- Column for Asset Code (รหัสครุภัณฑ์) with dropdown -->
                        <td *ngIf="column === 'รหัสครุภัณฑ์'" class="align-middle">
                          <mat-select 
                            [formControl]="$any(formGroup.get(column)!)" 
                            placeholder="เลือกครุภัณฑ์" 
                            class="w-100">
                            <mat-option>
                              <ngx-mat-select-search [formControl]="assetdataFilterCtrl"></ngx-mat-select-search>
                            </mat-option>
                            <mat-option *ngFor="let assetData of filteredAssetData | async" [value]="assetData.assetId">
                              {{ assetData.assetCode }} 
                            </mat-option>
                          </mat-select>
                        </td>
            
                        <!-- Column for displaying Asset Name based on selected Asset Code -->
                        <td *ngIf="column === 'รายการ' && formGroup.get('รหัสครุภัณฑ์')!.value" class="align-middle">
                          <input type="text" class="form-control" [value]="getAssetName(formGroup.get('รหัสครุภัณฑ์')!.value)" disabled />
                        </td>
                      </ng-container>
                    </ng-container>
                  </tr>
                </tbody>
              </table>
            </div>
            

            <br />

            <button mat-raised-button class="btn btn-success anuphan-600" color="primary" type="submit"
              style="color: white">
              ดำเนินการ
            </button>

          </div>

        </form>
      </div>
    </div>

  </div>
</div>
