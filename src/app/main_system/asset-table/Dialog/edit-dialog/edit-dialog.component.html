<div class="card shadow-sm border-0">
    <div class="card-body">
        <mat-dialog-content>
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <h1 class="mb-4 fw-bold">
                    <span class="anuphan-700">
                        แก้ไขข้อมูลครุภัณฑ์
                    </span>
                </h1>
        
                <div class="row g-3">
                <!-- รหัสครุภัณฑ์ -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>รหัสครุภัณฑ์</mat-label>
                    <input matInput formControlName="AssetCode"  />
                    </mat-form-field>
                </div>
        
                <!-- ชื่อครุภัณฑ์ -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>ชื่อครุภัณฑ์</mat-label>
                    <input matInput formControlName="AssetName"  />
                    </mat-form-field>
                </div>
        
                <!-- ประเภท -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>ประเภทครุภัณฑ์</mat-label>
                    <mat-select formControlName="TypeId">
                        <mat-option *ngFor="let type of assetTypes" 
                        [value]="type.TypeId">{{ type.TypeName }}</mat-option>
                    </mat-select>
                    </mat-form-field>
                </div>
        
                <!-- หมวดหมู่ -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>หมวดหมู่</mat-label>
                    <mat-select formControlName="CategoryId">
                        <mat-option *ngFor="let cat of assetCategories" 
                        [value]="cat.CategoryId">{{ cat.CategoryName }}</mat-option>
                    </mat-select>
                    </mat-form-field>
                </div>
        
                <!-- หน่วยงาน -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label>หน่วยงาน</mat-label>
                        <mat-select formControlName="DepartmentId">
                        <mat-option *ngFor="let d of departments" [value]="d.DeptId">
                            {{ d.Name }}
                        </mat-option>
                        </mat-select>
                    </mat-form-field>
                                
                </div>
        
                <!-- ฝ่าย -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>ฝ่าย</mat-label>
                    <mat-select formControlName="FactionId">
                        <mat-option *ngFor="let f of factions" [value]="f.FactId">{{ f.Name }}</mat-option>
                    </mat-select>
                    </mat-form-field>
                </div>
        
                <!-- สถานะ -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>สถานะ</mat-label>
                    <mat-select formControlName="StatusId">
                        <mat-option *ngFor="let s of statuses" [value]="s.StatusId">{{ s.NStatus }}</mat-option>
                    </mat-select>
                    </mat-form-field>
                </div>
        
                <!-- ผู้รับผิดชอบ -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>ชื่อผู้รับผิดชอบ</mat-label>
                    <input matInput formControlName="ResponsibleEmployee"  />
                    </mat-form-field>
                </div>
        
                <!-- วันที่ (1 คอลัมน์) -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>วันที่จัดซื้อ</mat-label>
                    <input matInput [matDatepicker]="picker1" formControlName="PurchaseDate" />
                    <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                    </mat-form-field>
                </div>
        
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>วันที่รับเข้า</mat-label>
                    <input matInput [matDatepicker]="picker2" formControlName="ReceiptDate" />
                    <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                    <mat-datepicker #picker2></mat-datepicker>
                    </mat-form-field>
                </div>
        
                <!-- ค่าเงิน -->
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>ราคาซื้อ</mat-label>
                    <input matInput type="number" formControlName="PurchasePrice" />
                    </mat-form-field>
                </div>
        
                <div class="col-md-3">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>มูลค่าคงเหลือ</mat-label>
                    <input matInput type="number" formControlName="BookValue" />
                    </mat-form-field>
                </div>
        
                <!-- หมายเหตุ (เต็มคอลัมน์) -->
                <div class="col-md-6">
                    <mat-form-field appearance="fill" class="w-100">
                    <mat-label>หมายเหตุ</mat-label>
                    <input matInput rows="2" formControlName="Note" />
                    </mat-form-field>
                </div>
                </div>
        
                <!-- ปุ่มบันทึก -->
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button class="btn btn-secondary" (click)="closeDialog()" type="button">ยกเลิก</button>
                    <button class="btn btn-primary" type="submit">บันทึก</button>
                </div>
            </form>

        </mat-dialog-content>
    </div>
  </div>
