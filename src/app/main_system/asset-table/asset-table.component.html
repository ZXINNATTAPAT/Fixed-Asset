<div class="card shadow-sm" style="border: none">
  <div class="card-body">
    <div class="border-bottom mb-3" style="display: flex; justify-content: space-between; align-items: center">
      <div style="margin-right: auto">
        <h1>
          <span class="anuphan-700">รายการครุภัณฑ์</span>
        </h1>
      </div>
      <p>
        ส่งออกข้อมูล :
        <button class="btn btn-success" type="button" (click)="exportExcel()" style="color: white">

                  -0.01953 0.82031,-0.20703c0.22656,-0.1875 0.36328,-0.46484 0.36719,-0.76172v-5h17c1.09375,0 2,-0.90625 2,

                  15.6875l5.46875,9.34375l-5.96875,9.34375h5l3.25,-6.03125c0.22656,-0.58203 0.375,-1.02734 0.4375,-1.3125h0.03125c0.12891,0.60938 0.25391,

              </g>
            </g>
          </svg>
        </button>
      </p>
    </div>

    <div class="row mb-3">
    
      <div class="col-2">
        <label class="form-label">กรองตามประเภทครุภัณฑ์</label>
        <mat-form-field appearance="fill" class="w-100">
          <mat-select [(ngModel)]="selectedAssetType" (selectionChange)="onAssetTypeChange()" placeholder="เลือกประเภท">
            <mat-option value="">ทั้งหมด</mat-option>
            <mat-option *ngFor="let type of assetTypes" [value]="type.TypeId">
              {{ type.TypeName }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-2">
        <label class="form-label">กรองตามหมวดหมู่</label>
        <mat-form-field appearance="fill" class="w-100">
          <mat-select 
            placeholder="เลือกหมวดหมู่"
            [(ngModel)]="selectedCategoryId" 
            (selectionChange)="filterByCategory()"
            [formControl]="categoryCtrl" >
      
            <!-- 🔍 ช่องค้นหา -->
            <mat-option>
              <ngx-mat-select-search [formControl]="categoryFilterCtrl"
                                     placeholderLabel="ค้นหาหมวดหมู่"
                                     noEntriesFoundLabel="ไม่พบหมวดหมู่">
              </ngx-mat-select-search>
            </mat-option>
      
            <!-- 🔽 ตัวเลือก -->
            <mat-option [value]="null">ทั้งหมด</mat-option>
            <mat-option *ngFor="let cat of filteredCategoryList" [value]="cat.CategoryId">
              {{ cat.CategoryName }}
            </mat-option>
      
          </mat-select>
        </mat-form-field>
      </div>
      
      

      <!-- Paginator -->
      <div class="col">
        <br />
        <mat-paginator [pageSizeOptions]="[5, 10, 15, 30, 50, 70, 100]" [pageSize]="10" showFirstLastButtons
          class="paginator-style"></mat-paginator>
      </div>
    </div>


    <div class="table-responsive">
      <table class="table table-striped table-hover" style="font-size: 10.5px; width: fit-content" mat-table matSort
        [dataSource]="dataSource">

        <!-- Actions Column -->
        <ng-container matColumnDef="Aactions">

          <th class="text-center border" mat-header-cell *matHeaderCellDef style="color: black; font-weight: bold">
            # <input cFormControl sizing="sm" disabled />
          </th>

          <td class="border" mat-cell *matCellDef="let asset" style="width: 12%">

            <button class="btn btn-sm  btn-primary m-1" (click)="assetDialog(asset.AssetId)">
              <svg [cIcon]="this.myFunctionInstance?.icons?.cilSearch"
                style="color: white; width: 16px; height: 16px;"></svg>
            </button>

            <button class="btn btn-sm  btn-warning m-1" (click)="editDialog(asset.AssetId)">
              <svg [cIcon]="this.myFunctionInstance?.icons?.cilPencil"
                style="color: white; width: 16px; height: 16px;"></svg>
            </button>

            <button class="btn btn-sm btn-danger m-1" (click)="deleteAsset(asset)">
              <svg [cIcon]="this.myFunctionInstance?.icons?.cilTrash"
                style="color: white; width: 16px; height: 16px;"></svg>
            </button>
          </td>

        </ng-container>

        <ng-container matColumnDef="Qrcode">
          <th class="text-center border" mat-header-cell *matHeaderCellDef
            style="color: black; font-weight: bold;width: 5%;">
            Qrcode
            <input cFormControl sizing="sm" disabled />
          </th>

          <td class="border" mat-cell *matCellDef="let asset" style="width: fit-content">
            <div *ngIf="asset.qrCodeUrl">
              <img [src]="asset.qrCodeUrl" alt="QR Code" style="width: 50px; height: 50px; margin-top: 5px" />
            </div>
          </td>
        </ng-container>

        <!-- Dynamic Columns -->
        <ng-container *ngFor="let column of displayedColumns2; let i = index" [matColumnDef]="column">
          <th class="mat-header-cell anuphan-600 border" mat-header-cell *matHeaderCellDef mat-sort-header
            [style.width]="column === 'สถานะ' ? '2%' : (column === 'รายการ' ? '20%' : 'auto')">
            <div style="color: black; font-weight: bold">
              <label cLabel [for]="'filter-' + column">{{ column }}</label>
              <input cFormControl sizing="sm" [id]="'filter-' + column" placeholder="ค้นหาข้อมูล" (keyup)="applyFilter($event)"
                (focus)="setupFilter(column)" />
            </div>
          </th>

          <td class="anuphan-500 border" mat-cell *matCellDef="let asset">
            <!-- Handle currency formatting -->
            <ng-container *ngIf="column === 'ราคาต่อหน่วย'; else defaultFormat">
              {{ asset[column] | currency : "" : "" : "1.2-2" }}
            </ng-container>

            <!-- Handle status badge formatting -->
            <ng-template #defaultFormat>
              <ng-container *ngIf="column === 'สถานะ'; else normalText">
                <span class="badge text-light" [ngClass]="{
                    'text-bg-success': asset[column] !== 'โอนย้าย' && 
                                      asset[column] !== 'ซ่อมแซม' && 
                                      asset[column] !== 'ส่งมอบ' && 
                                      asset[column] !== '',
                    'text-bg-warning': asset[column] === 'โอนย้าย' || asset[column] === 'ส่งมอบ',
                    'text-bg-danger': asset[column] === 'ซ่อมแซม'
                  }" style="color: black; font-size: 16px;">
                  {{ asset[column] || 'ปกติ' }}
                </span>
              </ng-container>

              <!-- Default text display -->
              <ng-template #normalText>
                {{ asset[column] }}
              </ng-template>
            </ng-template>
          </td>
        </ng-container>


        <!-- Header Row -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns3"></tr>

        <!-- Data Rows -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns3"></tr>
      </table>

    </div>

  </div>

</div>
