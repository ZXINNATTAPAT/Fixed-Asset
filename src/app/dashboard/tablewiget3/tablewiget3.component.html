<div class="card border shadow">

  <div class="card-body">

    <h3 class="border-bottom">
      <span class="anuphan-700" style="color: green;">รายละเอียดครุภัณฑ์ที่ครอบครอง</span>
    </h3>

    <div class="table-responsive">
      <table class="table table-striped table-hover anuphan-600" mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="category">
          <th class="anuphan-600" mat-header-cell *matHeaderCellDef style="font-weight: bold">หมวดหมู่ครุภัณฑ์</th>
          <td class="anuphan-400" mat-cell *matCellDef="let element">
            {{ element.category }}
          </td>
        </ng-container>

        <ng-container matColumnDef="assetType">
          <th class="anuphan-600" mat-header-cell *matHeaderCellDef style="font-weight: bold">ประเภทครุภัณฑ์</th>
          <td class="anuphan-400" mat-cell *matCellDef="let element">
            {{ element.assetType }}
          </td>
        </ng-container>

        <ng-container matColumnDef="assetCount">
          <th class="anuphan-600" mat-header-cell *matHeaderCellDef style="font-weight: bold">จำนวน</th>
          <td class="anuphan-400" mat-cell *matCellDef="let element">
            {{ element.assetCount }}
          </td>
        </ng-container>

        <!-- Table rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <!-- Paginator -->
      <mat-paginator [length]="dataSource.data.length" [pageSizeOptions]="[5, 10, 50, 100]" showFirstLastButtons
        aria-label="Select page" class="paginator-style">
      </mat-paginator>

    </div>
  </div>
</div>
