<ng-container>
  <c-container fluid class="border-0" style="background-color: #30906a">

    <!-- ✅ Mobile: แสดงแค่ปุ่ม ☰ -->
    <c-header-nav class="d-flex d-md-none justify-content-between align-items-center px-3 py-2">
      <!-- ☰ ปุ่ม toggle sidebar -->
      <button class="btn btn-sm btn-outline-light text-white border" (click)="onToggleSidebar()">
        <svg cIcon name="cilMenu" size="md"></svg>
      </button>
    </c-header-nav>

    <!-- ✅ Desktop: แสดงข้อมูลผู้ใช้, สังกัด, แจ้งเตือน, โปรไฟล์ -->
    <c-header-nav class="d-none d-md-flex align-items-center">
      <!-- ปุ่ม toggle sidebar -->
      <button [cSidebarToggle]="sidebarId" cHeaderToggler toggle="visible"
        class="btn btn-sm btn-outline-light text-white border">
        <svg cIcon name="cilMenu" size="md"></svg>
      </button>

      <!-- ข้อความแสดงสังกัด -->
      <c-nav-item>
        <a cNavLink class="anuphan-700 text-white" style="font-size: medium;">
          <ng-container *ngIf="userinfo.Affiliation === 'ส่วนกลาง'; else regionalText">
            สำนักงานคณะกรรมการการเลือกตั้งส่วนกลาง ({{ userinfo.Department }})
          </ng-container>
          <ng-template #regionalText>
            สำนักงานคณะกรรมการการเลือกตั้งส่วนภูมิภาค {{ showCounty }} ({{ userinfo.Faction }})
          </ng-template>
        </a>
      </c-nav-item>
    </c-header-nav>

    <c-header-nav class="d-none d-md-flex ms-auto align-items-center">
      <!-- ปุ่มแจ้งเตือน -->
      
        <!-- ปุ่มแจ้งเตือน -->
        <div class="dropdown me-3">
          <button class="btn btn-sm btn-outline-warning position-relative dropdown-toggle anuphan-600"
                  id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            🔔
            <span *ngIf="unreadCount > 0"
                  class="badge bg-danger position-absolute top-0 start-100 translate-middle">
              {{ unreadCount }}
            </span>
          </button>
      
          <div class="dropdown-menu dropdown-menu-end p-0" aria-labelledby="notificationDropdown"
          style="width: 300px;">
       
       <ul class="list-unstyled m-0 p-0" style="max-height: 300px; overflow-y: auto;">
         <li *ngIf="notifications.length === 0" class="dropdown-item text-muted text-center">
           ไม่มีการแจ้งเตือน
         </li>
     
         <li *ngFor="let notification of notifications"
             class="dropdown-item d-flex justify-content-between align-items-center"
             [class.unread]="!notification.IsRead">
     
           <span>{{ notification.Message }}</span>
     
           <button *ngIf="!notification.IsRead"
                   class="btn btn-sm btn-secondary m-1"
                   (click)="markAsRead(notification.NotificationId)">
             ✔
           </button>
         </li>
       </ul>
     

      
            <!-- เส้นคั่น + ปุ่มอ่านทั้งหมด -->
            <div class="border-top text-center p-2">
              <button class="btn btn-sm btn-outline-secondary w-100" (click)="markAllAsRead()">
                อ่านทั้งหมด
              </button>
            </div>
      
          </div>
        </div>
      

      <!-- เมนูโปรไฟล์ -->
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-light dropdown-toggle anuphan-600" id="menuDropdown"
          data-bs-toggle="dropdown" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-person">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1
            1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10
            8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
          </svg>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuDropdown">
          <!-- <li><a class="dropdown-item" routerLink="/users">ประวัติผู้ใช้งาน</a></li> -->
          <!-- <li><a class="dropdown-item" routerLink="/settings">ตั้งค่า</a></li> -->
          <li><a class="dropdown-item" (click)="Logout()">ออกจากระบบ</a></li>
        </ul>
      </div>
    </c-header-nav>

  </c-container>
</ng-container>
