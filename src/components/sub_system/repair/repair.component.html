<div class="container p-4 bg-white shadow rounded">

  <h1><span class="anuphan-700">รายการบันทึกการซ่อมแซมและบำรุงรักษา</span></h1>
  <hr />

  
    <form cForm (submit)="onSubmit()">

        <div class="row mb-3 m-1">

          <!-- 🔍 รหัสครุภัณฑ์ -->
          <div class="col-4">
            <label for="assetCode" class="form-label">รหัสครุภัณฑ์</label>
            <div class="input-group">
              <span class="input-group-text" id="inputGroup-sizing-default">กกต</span>
              <input type="text" class="form-control" placeholder="พิมพ์คำค้นหา" [(ngModel)]="searchTerm"
                [ngModelOptions]="{ standalone: true }" />
              <button type="button" class="btn btn-success" (click)="onSearch()" style="color:white">
                ค้นหา
              </button>
            </div>
          </div>
        
          <!-- 🏷 ชื่อครุภัณฑ์ -->
          <div class="col-4">
            <label cLabel for="assetName">ชื่อครุภัณฑ์</label>
            <input cFormControl type="text" id="assetName" placeholder="ชื่อครุภัณฑ์จะปรากฏที่นี่"
              [value]="asset.AssetName" disabled class="form-control" />
          </div>
        
          <!-- 📅 วันที่ซ่อม -->
          <div class="col-4">
            <label class="form-label" for="repairDate">📅 วันที่ซ่อม</label>
            <input
              type="date"
              class="form-control"
              id="repairDate"
              [(ngModel)]="asset.Date"
              name="repairDate"
              [ngModelOptions]="{ standalone: true }"
            />
          </div>
        
        </div>
     

      <div class="row mb-3 m-1">
        <div class="col">
          <label class="form-label" for="serialNumber">เลขที่ใบสั่งซ่อม</label>
          <input
            type="text"
            class="form-control"
            id="serialNumber"
            name="SerialNumber"
            [(ngModel)]="asset.SerialNumber"
            [ngModelOptions]="{ standalone: true }"
          />
        </div>

        <div class="col">
          <label cLabel for="assetCodeInput">รายละเอียด</label>
          <input cFormControl name="Description" id="assetCodeInput" placeholder="ระบุรายละเอียด" class="form-control"
            type="text" [(ngModel)]="asset.Description" required />
        </div>

        <div class="col">
          <label cLabel for="assetCodeInput">จำนวนเงิน</label>
          <input cFormControl name="Amount" id="assetCodeInput" placeholder="ระบุจำนวนเงิน" class="form-control "
            type="number" [(ngModel)]="asset.Amount" required />
        </div>

        <div class="col-2 align-self-end">
          <button cButton class="anuphan-600" type="submit" color="success" style="color: white">
            ดำเนินการ
          </button>
        </div>
      </div>

    </form>
  

  <div class="d-flex justify-content-between align-items-center m-1 mb-3">
    <!-- ปุ่มเพิ่มข้อมูล -->
    <!-- <button class="btn btn-sm btn-outline-success anuphan-500" (click)="isFormVisible = !isFormVisible"
        style="color: green">
        + เพิ่มข้อมูล
      </button> -->

    <!-- Paginator -->
  </div>

  <mat-paginator [pageSizeOptions]="[30, 50, 70, 100]" [pageSize]="15" showFirstLastButtons></mat-paginator>

  <div class="table-responsive">

    <table mat-table [dataSource]="dataSource" matSort class="table table-striped table-hover border">

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th class="border anuphan-700" mat-header-cell *matHeaderCellDef style="font-weight: bold">#</th>
        <td mat-cell *matCellDef="let asset">
          <button class="btn btn-sm btn-warning m-1" (click)="editAsset(asset)">
            <svg [cIcon]="icons.cilPencil" style="color: white; width: 16px; height: 16px;"></svg>
          </button>
          <button class="btn btn-sm btn-danger m-1" (click)="deleteAsset(asset)">
            <svg [cIcon]="icons.cilTrash" style="color: white; width: 16px; height: 16px;"></svg>
          </button>
        </td>
      </ng-container>

      <!-- Dynamic Columns -->
      <ng-container *ngFor="let column of displayedColumns2">
        <ng-container [matColumnDef]="column" *ngIf="column !== 'actions'">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="border anuphan-600" style="font-weight: bold">
            {{ column }}
          </th>
          <td mat-cell class="border anuphan-400" *matCellDef="let asset">
            <ng-container *ngIf="column === 'วันที่ซ่อม'; else normalCell">
              {{ convertToThaiFullDate(asset[column]) }}
            </ng-container>
            <ng-template #normalCell>
              {{ asset[column] }}
            </ng-template>
          </td>
          
        </ng-container>
      </ng-container>


      <!-- Header Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>

      <!-- Data Rows -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns2;"></tr>
      <!-- No Data Row -->
      <tr class="text-center" *matNoDataRow>
        <td class="border text-center" [attr.colspan]="displayedColumns2.length ">
          ยังไม่มีข้อมูลในขณะนี้
        </td>
      </tr>
    </table>


  </div>


</div>
