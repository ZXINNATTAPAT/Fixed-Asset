<div class="container p-4 bg-white shadow rounded">
  
    <h1><span class="anuphan-700">กำหนดหน่วยนับ</span></h1>
    <hr />
    <form cForm (submit)="onSubmit()">
      <div class="card" style="border: none">
        <div class="card-body">
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 mb-3">
            <div class="col">
              <label class="form-label" for="assetCodeInput">รหัสหน่วยนับ</label>
              <input id="assetCodeInput" placeholder="ระบุหน่วยนับ" name="unitCode" [(ngModel)]="asset.unitCode"
                class="form-control" type="text" />
            </div>

            <div class="col">
              <label class="form-label" for="assetNameInput">ชื่อหน่วยนับ</label>
              <input id="assetNameInput" placeholder="ระบุชื่อหน่วยนับ" class="form-control" name="unitName"
                [(ngModel)]="asset.unitName" type="text" />
            </div>

            <div class="col align-self-end">
              <button class="btn btn-primary">เพิ่ม</button>
            </div>
          </div>
        </div>
      </div>
    </form>
    
    <!-- Paginator -->
      <mat-paginator [pageSizeOptions]="[30, 50, 70, 100]" [pageSize]="10" showFirstLastButtons></mat-paginator>

    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort class="table table-striped table-hover">

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="border" style="font-weight: bold;width: 10%;" >#</th>
          <td mat-cell *matCellDef="let asset" class="border">
            <button class="btn btn-sm btn-warning m-1" (click)="editAsset(asset)">
              <svg [cIcon]="icons.cilPencil" style="color: white; width: 16px; height: 16px;"></svg>
            </button>
            <button class="btn btn-sm btn-danger m-1" (click)="deleteAsset(asset)">
              <svg [cIcon]="icons.cilTrash" style="color: white; width: 16px; height: 16px;"></svg>
            </button>
          </td>
        </ng-container>
      
        <!-- รหัสหน่วยนับ -->
        <ng-container matColumnDef="Unitcode">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="border" style="font-weight: bold;width: 10%;" >รหัสหน่วยนับ</th>
          <td mat-cell *matCellDef="let asset" class="border">{{ asset.Unitcode }}</td>
        </ng-container>
      
        <!-- ชื่อหน่วยนับ -->
        <ng-container matColumnDef="Unitname">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="border" style="font-weight: bold">ชื่อหน่วยนับ</th>
          <td mat-cell *matCellDef="let asset" class="border">{{ asset.Unitname }}</td>
        </ng-container>
      
        <!-- Header Row -->
        <tr mat-header-row *matHeaderRowDef="['actions', 'Unitcode', 'Unitname']"></tr>
      
        <!-- Data Rows -->
        <tr mat-row *matRowDef="let row; columns: ['actions', 'Unitcode', 'Unitname']"></tr>
      </table>
      

      
    </div>
  
</div>
