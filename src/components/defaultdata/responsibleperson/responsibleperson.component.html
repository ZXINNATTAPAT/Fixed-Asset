<!-- defaultdata.component.html -->

<c-card class="mb-4 shadow-sm" style="border: none">
    <c-card-body>

      <h1><span class="anuphan-700">กำหนดรหัสผู้รับผิดชอบ</span></h1>


      <form cForm (submit)="onSubmit()">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 mb-3">
          <div class="col-5">
            <label cLabel for="responsiblePersonCodeInput">รหัสพนักงาน</label>
            <input
              cFormControl
              id="responsiblePersonCodeInput"
              placeholder="ระบุรหัสพนักงาน"
              name="rP_Code"
              [(ngModel)]="asset.rP_Code"
              class="form-control"
              type="text"
              required
            />
          </div>
          <div class="col-6">
            <label cLabel for="responsiblePersonNameInput">ชื่อพนักงาน</label>
            <input
              cFormControl
              id="responsiblePersonNameInput"
              placeholder="ระบุชื่อพนักงาน"
              name="rP_Name"
              [(ngModel)]="asset.rP_Name"
              class="form-control"
              type="text"
              required
            />
          </div>
          <div class="col align-self-end">
            <button type="submit" class="btn btn-primary">เพิ่ม</button>
          </div>
        </div>
      </form>
      

      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort class="table table-striped table-hover">
          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef style="font-weight: bold;">#</th>
            <td mat-cell *matCellDef="let asset">
              <button
                class="btn btn-sm btn-warning m-1"
                (click)="editAsset(asset)"
                style="width: 28px; height: 28px; padding: 4px;"
              >
                <svg [cIcon]="icons.cilPencil" style="color: white; width: 100%; height: 100%;"></svg>
              </button>
      
              <button
                class="btn btn-sm btn-danger m-1"
                (click)="deleteAsset(asset)"
                style="width: 28px; height: 28px; padding: 4px;"
              >
                <svg [cIcon]="icons.cilTrash" style="color: white; width: 100%; height: 100%;"></svg>
              </button>
            </td>
          </ng-container>
      
          <!-- Dynamic Columns -->
          <ng-container *ngFor="let column of displayedColumns2" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bold;">{{ column }}</th>
            <td mat-cell *matCellDef="let asset">{{ asset[column] }}</td>
          </ng-container>
      
          <!-- Header Row -->
          <tr mat-header-row *matHeaderRowDef="['actions', 'รหัสพนักงาน', 'ชื่อพนักงาน']"></tr>
      
          <!-- Data Rows -->
          <tr mat-row *matRowDef="let row; columns: ['actions', 'รหัสพนักงาน', 'ชื่อพนักงาน']"></tr>
        </table>
      
        <!-- Paginator -->
        <mat-paginator [pageSizeOptions]="[30, 50, 70, 100]" [pageSize]="15" showFirstLastButtons></mat-paginator>
      </div>
      
        
    </c-card-body>
  </c-card>
